  --CODE-INLINE-BG-color: rgba(204, 255, 0, 0.08);
  --CODE-INLINE-color: #CCFF00;

}

/* ─── GLOBAL ─── */
*, *::before, *::after {

}

html {

}

body {

::-webkit-scrollbar-track {

.searchbox,

.searchbox button,
#R-sidebar .searchbox button,

#R-sidebar ul li,

#R-sidebar ul li.visited,
#R-sidebar .topics li.active,
#R-sidebar .parent > li.active {

#R-sidebar ul li a,
#R-sidebar .topics a,
#R-sidebar .padding a {
  color: var(--kong-gray-300) !important;
  font-family: 'Funnel Sans', sans-serif !important;

/* Override Relearn's default highlight colors */
#R-sidebar .topics > li.active > a,
#R-sidebar .topics > li.visited > a,
#R-sidebar #R-navigation-wrapper li.active > a,
#R-sidebar .collapsible-menu li.active > a {

/* Kill the blue/cyan background on active items */
#R-sidebar li.active,
#R-sidebar li.active > a,
#R-sidebar #R-navigation-wrapper li.active,
#R-sidebar .collapsible-menu li.active {

#R-topbar,

h1, h2, h3, h4, h5, h6 {

}

}

}

h3 {

}

#R-body a:hover,

.content a:hover {

}

ul, ol {

}

}

li::marker {

}

/* ─── CODE BLOCKS ─── */
pre {
  background: var(--kong-gray-900) !important;

}

pre code {
  background: transparent !important;
  border: none !important;
  padding: 0 !important;
  font-family: 'Roboto Mono', monospace !important;
  font-size: 13px !important;
  color: var(--kong-gray-100) !important;
}

/* Inline code */
code {
  background: rgba(204, 255, 0, 0.08) !important;

}

.copy-to-clipboard-button,

}

.copy-to-clipboard-button:hover,
.highlight .copy:hover {
  background: var(--kong-electric-lime) !important;
  color: var(--kong-dark-green) !important;
}

table {

}

th {

  font-size: 11px !important;

}

td {

}

}

  color: var(--kong-gray-200) !important;

}

  font-weight: 700 !important;

#R-body button:hover,

/* ─── TABS (Relearn shortcode) ─── */
.tab-nav,

.tab-nav button:hover,
.tab-nav .tab-item:hover {

.tab-nav button.active,

.tab-content {

    background: #f5f5f5 !important;
